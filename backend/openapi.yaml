openapi: 3.0.3
info:
  title: УК-инциденты API
  version: 0.3.0
  description: |
    Бэкенд мини-аппа MAX для жильцов и УК. Источник правды по контракту —
    этот файл: из него генерируется Go-сервер (`make gen`) и TS-клиент для фронта
    (`npx openapi-typescript backend/openapi.yaml -o src/shared/api/schema.d.ts`).

    Контракт зафиксирован фронтом (shared/api/client.ts + zod-схемы): camelCase,
    nullable-поля всегда присутствуют в ответе (ключ есть, значение null),
    ошибки — единая форма {code, message, details?}.

    Авторизация: заголовок `Authorization: tma <initData>` (житель, `auth_date` не старше 24ч)
    или `Authorization: Bearer <jwt>` (сотрудник УК, токен из `POST /api/auth/esia-mock`).
    Роль берётся из токена: `/api/uk/*` и смена статуса — только `uk_dispatcher`,
    действия жителя (привязка дома, заявки, «у меня тоже», подтверждение, фото) — только `resident`.
servers:
  - url: http://localhost:8080
security:
  - TmaInitData: []
  - UkBearer: []

paths:
  /health:
    get:
      operationId: health
      security: []
      tags: [system]
      responses:
        "200":
          description: OK
          content:
            text/plain:
              schema: { type: string, example: ok }

  /api/me:
    get:
      operationId: getMe
      tags: [profile]
      summary: Текущий пользователь + привязанный дом (пользователь создаётся лениво)
      responses:
        "200":
          description: Профиль
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MeResponse" }
        "401": { $ref: "#/components/responses/Error" }

  /api/houses/bind:
    post:
      operationId: bindHouse
      tags: [profile]
      summary: Привязать дом по свободному адресу (нормализуется через DaData)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/BindHouseRequest" }
      responses:
        "200":
          description: Дом
          content:
            application/json:
              schema: { $ref: "#/components/schemas/House" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
    delete:
      operationId: unbindHouse
      tags: [profile]
      summary: Отвязать дом (выход жителя); повтор — тоже 204
      responses:
        "204": { description: Дом отвязан }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }

  /api/auth/esia-mock:
    post:
      operationId: esiaMockLogin
      security: []
      tags: [uk]
      summary: Вход сотрудника УК (mock ЕСИА + реестр лицензий ГИС ЖКХ + полномочие «Сотрудник АДС»)
      description: |
        `Authorization: tma <initData>` необязателен; если он валиден — max user id пишется в аудит попыток.
        Неизвестная организация, недействующая лицензия, нет полномочия АДС и неверный пароль — одинаковый 403.
        Больше 5 неудачных попыток на ИНН за 15 минут — 429.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/EsiaMockLoginRequest" }
      responses:
        "200":
          description: Сессия диспетчера
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UkSession" }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/Error" }

  /api/uk/queue:
    get:
      operationId: listUkQueue
      tags: [uk]
      summary: Очередь заявок домов своей УК (affectedCount desc, critical, dueAt asc, createdAt asc)
      parameters:
        - name: offset
          in: query
          schema: { type: integer, minimum: 0, default: 0 }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 100 }
      responses:
        "200":
          description: Страница очереди
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PaginatedUkQueue" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }

  /api/uk/incidents/merge:
    post:
      operationId: mergeIncidents
      tags: [uk]
      summary: Ручная склейка заявок одного дома диспетчером; источники закрываются, подписчики/фото/подтверждения переносятся на главную
      description: |
        Повторная склейка уже склеенных в эту же главную заявок идемпотентна (200).
        Чужая УК → 403, заявки разных домов или закрытые → 422, несуществующий id → 404.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MergeIncidentsRequest" }
      responses:
        "200":
          description: Заявки склеены
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MergeIncidentsResponse" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }

  /api/uk/events:
    post:
      operationId: createUkEvent
      tags: [uk]
      summary: Плановые работы по дому своей УК (чужой дом → 404)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateEventRequest" }
      responses:
        "201":
          description: Событие создано
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Event" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }

  /api/events:
    get:
      operationId: listEvents
      tags: [events]
      summary: Текущие и будущие плановые работы дома (житель дома или диспетчер его УК; иначе 404)
      parameters:
        - name: houseId
          in: query
          required: true
          schema: { type: string }
      responses:
        "200":
          description: События (scheduledFrom asc)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EventListResponse" }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }

  /api/houses/suggest:
    get:
      operationId: suggestAddresses
      tags: [profile]
      summary: Подсказки адреса для автокомплита (прокси к DaData — токен живёт на сервере)
      parameters:
        - name: query
          in: query
          required: true
          schema: { type: string, minLength: 1, maxLength: 200 }
        - name: count
          in: query
          schema: { type: integer, minimum: 1, maximum: 10, default: 5 }
      responses:
        "200":
          description: Подсказки (только объекты с house_fias_id)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AddressSuggestResponse" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "502": { $ref: "#/components/responses/Error" }

  /api/houses/{houseId}/incidents:
    get:
      operationId: listHouseIncidents
      tags: [incidents]
      summary: Активные аварии дома (critical сначала, затем createdAt desc)
      parameters:
        - { $ref: "#/components/parameters/HouseID" }
        - name: status
          in: query
          schema: { type: string, enum: [active] }
      responses:
        "200":
          description: Список
          content:
            application/json:
              schema: { $ref: "#/components/schemas/IncidentListResponse" }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }

  /api/houses/{houseId}/requests:
    get:
      operationId: listHouseRequests
      tags: [requests]
      summary: "«Мои заявки»: аварии дома, где пользователь — автор или подписчик («у меня тоже»/дедуп)"
      parameters:
        - { $ref: "#/components/parameters/HouseID" }
        - name: offset
          in: query
          schema: { type: integer, minimum: 0, default: 0 }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
      responses:
        "200":
          description: Страница заявок
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PaginatedResidentRequests" }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }

  /api/houses/{houseId}/stats:
    get:
      operationId: houseStats
      tags: [stats]
      summary: Статистика дома (житель дома или диспетчер его УК; чужой дом → 404)
      parameters: [{ $ref: "#/components/parameters/HouseID" }]
      responses:
        "200":
          description: Статистика
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HouseStats" }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }

  /api/houses/{houseId}/sticker:
    get:
      operationId: houseSticker
      security: []
      tags: [stats]
      summary: Наклейка для подъезда с QR на мини-приложение (публично — открывается и печатается из браузера)
      parameters: [{ $ref: "#/components/parameters/HouseID" }]
      responses:
        "200":
          description: SVG для печати
          content:
            image/svg+xml: { schema: { type: string, format: binary } }
        "404": { $ref: "#/components/responses/Error" }

  /api/incidents:
    post:
      operationId: createIncident
      tags: [incidents]
      summary: "«Сообщить о новой проблеме» (с дедупом по дому+категории+зоне в окне 2ч)"
      description: |
        title и severity выводятся из category. 422 business_rule_failed: категория не в зоне УК,
        нет обязательного фото, фото чужое или уже привязано к другой заявке.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateIncidentRequest" }
      responses:
        "201":
          description: Создана новая авария
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Incident" }
        "200":
          description: Приклеена к существующей аварии (дедуп)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Incident" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/Error" }

  /api/incidents/analyze:
    post:
      operationId: analyzeIncident
      tags: [incidents]
      summary: Категория по описанию (классификатор Laya) и ответственный по таблице категорий
      description: |
        503 model_unavailable — модель недоступна, не ответила за 10 с или не уверена.
        Любой не-2xx фронт превращает в ручной выбор.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AnalyzeIncidentRequest" }
      responses:
        "200":
          description: Уверенная классификация
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AnalyzeIncidentResponse" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }

  /api/incidents/photos:
    post:
      operationId: uploadStagedPhoto
      tags: [incidents]
      summary: Фото до создания заявки (jpeg/png/heic/heif, до 10 МБ); HEIC конвертируется в JPEG
      description: |
        Фото ни к чему не привязано, пока его url не придёт в photoUrls при создании заявки.
        Непривязанные фото удаляются через 24 ч. Не больше 20 загрузок в час (429 rate_limited).
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [photo]
              properties:
                photo: { type: string, format: binary }
      responses:
        "201":
          description: Фото сохранено
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Photo" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/Error" }

  /api/incidents/{id}:
    get:
      operationId: getIncident
      tags: [incidents]
      summary: Карточка аварии
      parameters: [{ $ref: "#/components/parameters/ID" }]
      responses:
        "200":
          description: Авария
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Incident" }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }

  /api/incidents/{id}/join:
    post:
      operationId: joinIncident
      tags: [incidents]
      summary: "«У меня тоже» (идемпотентно: повтор — 200 с текущим состоянием)"
      parameters: [{ $ref: "#/components/parameters/ID" }]
      responses:
        "200":
          description: Подписан
          content:
            application/json:
              schema: { $ref: "#/components/schemas/JoinResponse" }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }

  /api/incidents/{id}/confirm:
    post:
      operationId: confirmIncident
      tags: [incidents]
      summary: "Цифровое рукопожатие: «Починили» (идемпотентно)"
      parameters: [{ $ref: "#/components/parameters/ID" }]
      responses:
        "200":
          description: Текущий статус после подтверждения
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ConfirmResponse" }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }

  /api/incidents/{id}/status:
    patch:
      operationId: setIncidentStatus
      tags: [incidents]
      summary: Смена статуса диспетчером УК (accepted→in_progress, in_progress→verifying, verifying→done; чужая УК → 404)
      parameters: [{ $ref: "#/components/parameters/ID" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SetIncidentStatusRequest" }
      responses:
        "200":
          description: Авария с новым статусом
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Incident" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }

  /api/incidents/{id}/photos:
    post:
      operationId: uploadIncidentPhoto
      tags: [incidents]
      summary: Фото к обращению (jpeg/png/heic, до 10 МБ; HEIC конвертируется в JPEG); отдаётся по Photo.url без авторизации
      description: |
        Только автор или подписчик («у меня тоже») аварии — иначе 403. Не больше 5 фото на аварию
        (422 business_rule_failed) и не больше 20 загрузок в час от одного пользователя (429 rate_limited).
      parameters: [{ $ref: "#/components/parameters/ID" }]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [photo]
              properties:
                photo: { type: string, format: binary }
      responses:
        "201":
          description: Фото сохранено
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Photo" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/Error" }

  /api/photos/{id}:
    get:
      operationId: getPhoto
      security: []
      tags: [incidents]
      summary: Содержимое фото (публично — вебвью грузит <img> без заголовка Authorization)
      parameters: [{ $ref: "#/components/parameters/ID" }]
      responses:
        "200":
          description: Файл
          content:
            image/jpeg: { schema: { type: string, format: binary } }
            image/png: { schema: { type: string, format: binary } }
        "404": { $ref: "#/components/responses/Error" }

components:
  securitySchemes:
    TmaInitData:
      type: apiKey
      in: header
      name: Authorization
      description: "`tma <initData>` из MAX WebApp Bridge"
    UkBearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: "ES256 с `kid`; claims: sub, role, uk_id, org_inn, esia_oid, exp, jti"

  parameters:
    ID:
      name: id
      in: path
      required: true
      schema: { type: string }
    HouseID:
      name: houseId
      in: path
      required: true
      schema: { type: string }

  responses:
    Error:
      description: Ошибка
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ApiErrorResponse" }

  schemas:
    ApiErrorResponse:
      type: object
      required: [code, message]
      properties:
        code: { type: string, example: validation_failed }
        message: { type: string }
        details: {}

    Role:
      type: string
      enum: [resident, uk_dispatcher]

    User:
      type: object
      required: [id, fullName, role]
      properties:
        id: { type: string, example: u_123 }
        fullName: { type: string }
        role: { $ref: "#/components/schemas/Role" }

    House:
      type: object
      required: [id, address]
      properties:
        id: { type: string, example: h_123 }
        address: { type: string, example: "Казань, ул. Баумана, д. 10" }

    MeResponse:
      type: object
      required: [user, house]
      properties:
        user: { $ref: "#/components/schemas/User" }
        house:
          nullable: true
          allOf: [{ $ref: "#/components/schemas/House" }]

    BindHouseRequest:
      type: object
      required: [address]
      properties:
        address: { type: string, minLength: 1 }

    AddressSuggestion:
      type: object
      required: [value, houseFiasId]
      properties:
        value: { type: string, example: "г Казань, ул Баумана, д 10" }
        houseFiasId: { type: string, example: abc-123 }

    AddressSuggestResponse:
      type: object
      required: [suggestions]
      properties:
        suggestions:
          type: array
          items: { $ref: "#/components/schemas/AddressSuggestion" }

    Severity:
      type: string
      enum: [critical, warning]

    IncidentCategory:
      type: string
      enum: [WATER_HEAT, ELECTRICITY, ELEVATOR, CLEANING_YARD, BUILDING_STRUCTURE, CITY_TERRITORY]

    IncidentAuthority:
      type: string
      enum: [UK, FKR, RSO, MUNICIPALITY, OWNER]

    AnalyzeIncidentRequest:
      type: object
      required: [description]
      properties:
        description: { type: string, minLength: 10, maxLength: 2000 }

    AnalyzeIncidentResponse:
      type: object
      required: [category, authority, isUkResponsibility, photoRequired]
      properties:
        category: { $ref: "#/components/schemas/IncidentCategory" }
        authority: { $ref: "#/components/schemas/IncidentAuthority" }
        isUkResponsibility: { type: boolean }
        photoRequired: { type: boolean }
        reasoningText: { type: string }

    IncidentStatus:
      type: string
      enum: [accepted, in_progress, verifying, done]

    Incident:
      type: object
      required: [id, houseId, title, description, category, entrance, riser, severity, status, affectedCount,
                 createdAt, dueAt, joinedByMe, confirmedByMe, photos, supporters, mergedCount]
      properties:
        id: { type: string, example: inc_01H }
        houseId: { type: string, example: h_123 }
        title: { type: string }
        description: { type: string }
        category:
          nullable: true
          description: null у заявок, созданных до умного роутинга
          allOf: [{ $ref: "#/components/schemas/IncidentCategory" }]
        entrance: { type: string, nullable: true }
        riser: { type: string, nullable: true, description: "Этаж/зона (floorZone из запроса)" }
        severity: { $ref: "#/components/schemas/Severity" }
        status: { $ref: "#/components/schemas/IncidentStatus" }
        affectedCount: { type: integer, minimum: 0 }
        createdAt: { type: string, format: date-time }
        dueAt: { type: string, format: date-time, nullable: true }
        joinedByMe: { type: boolean }
        confirmedByMe: { type: boolean }
        photos:
          type: array
          items: { $ref: "#/components/schemas/Photo" }
        supporters:
          type: array
          maxItems: 5
          description: Превью подписантов для аватарок, отсортировано по времени подписки
          items: { $ref: "#/components/schemas/Supporter" }
        mergedCount: { type: integer, minimum: 0, description: "Сколько заявок склеено в эту (с учётом склеенных в них)" }

    Supporter:
      type: object
      required: [id, name, avatarUrl]
      properties:
        id: { type: string, example: u_123 }
        name: { type: string, nullable: true, description: "Имя и первая буква фамилии: «Анна М.»" }
        avatarUrl: { type: string, nullable: true, description: photo_url из initData MAX }

    Photo:
      type: object
      required: [id, url]
      properties:
        id: { type: string, example: ph_1 }
        url: { type: string, example: /api/photos/ph_1 }

    HouseStats:
      type: object
      required: [activeIncidents, inProgress, resolvedLast30Days, avgResolutionHours, lastIncidentAt]
      properties:
        activeIncidents: { type: integer, minimum: 0, description: "accepted + in_progress + verifying" }
        inProgress: { type: integer, minimum: 0 }
        resolvedLast30Days: { type: integer, minimum: 0 }
        avgResolutionHours: { type: number, format: double, nullable: true }
        lastIncidentAt: { type: string, format: date-time, nullable: true }

    IncidentListResponse:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/Incident" }

    CreateIncidentRequest:
      type: object
      required: [description, category, photoUrls]
      properties:
        title: { type: string, minLength: 3, maxLength: 120, description: краткое название заявки от пользователя; не влияет на автоопределение категории }
        description: { type: string, minLength: 10, maxLength: 2000 }
        category: { $ref: "#/components/schemas/IncidentCategory" }
        entrance: { type: string, maxLength: 40 }
        floorZone: { type: string, maxLength: 120 }
        photoUrls:
          type: array
          maxItems: 5
          description: url из POST /api/incidents/photos текущего пользователя, ещё не привязанные к заявке
          items: { type: string, example: /api/photos/ph_1 }

    SetIncidentStatusRequest:
      type: object
      required: [status]
      properties:
        status: { $ref: "#/components/schemas/IncidentStatus" }

    JoinResponse:
      type: object
      required: [incidentId, affectedCount, joined]
      properties:
        incidentId: { type: string }
        affectedCount: { type: integer, minimum: 0 }
        joined: { type: boolean }

    ConfirmResponse:
      type: object
      required: [incidentId, status, confirmedAt]
      properties:
        incidentId: { type: string }
        status: { $ref: "#/components/schemas/IncidentStatus" }
        confirmedAt: { type: string, format: date-time }

    ResidentRequest:
      type: object
      description: Заявка в «Моих заявках» — это тот же инцидент, id общий (inc_…) и годится для /confirm.
      required: [id, title, status, category, createdAt, dueAt, confirmedByMe]
      properties:
        id: { type: string, example: inc_01H }
        title: { type: string }
        status: { $ref: "#/components/schemas/IncidentStatus" }
        category:
          nullable: true
          description: null у заявок, созданных до умного роутинга
          allOf: [{ $ref: "#/components/schemas/IncidentCategory" }]
        createdAt: { type: string, format: date-time }
        dueAt: { type: string, format: date-time, nullable: true }
        confirmedByMe: { type: boolean }

    PaginatedResidentRequests:
      type: object
      required: [items, total, offset, limit]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/ResidentRequest" }
        total: { type: integer, minimum: 0 }
        offset: { type: integer, minimum: 0 }
        limit: { type: integer, minimum: 0 }

    EsiaMockLoginRequest:
      type: object
      required: [inn, password]
      properties:
        inn: { type: string, example: "1655000003" }
        password: { type: string, minLength: 1 }

    UkDispatcher:
      type: object
      required: [id, fullName, position, role]
      properties:
        id: { type: string, example: u_77 }
        fullName: { type: string }
        position: { type: string }
        role: { type: string, enum: [uk_dispatcher] }

    UkOrganization:
      type: object
      required: [id, inn, ogrn, name, licenseNumber]
      properties:
        id: { type: string, example: uk_1 }
        inn: { type: string }
        ogrn: { type: string, nullable: true }
        name: { type: string }
        licenseNumber: { type: string, nullable: true }

    UkSession:
      type: object
      required: [token, expiresAt, authMethod, user, organization]
      properties:
        token: { type: string }
        expiresAt: { type: string, format: date-time }
        authMethod: { type: string, enum: [esia_mock, esia] }
        user: { $ref: "#/components/schemas/UkDispatcher" }
        organization: { $ref: "#/components/schemas/UkOrganization" }

    UkQueueItem:
      type: object
      required: [id, houseId, houseAddress, title, description, category, severity, status, createdAt, dueAt,
                 affectedCount, confirmedCount, mergedCount, reporterName, photos]
      properties:
        id: { type: string }
        houseId: { type: string }
        houseAddress: { type: string }
        title: { type: string }
        description: { type: string }
        category:
          nullable: true
          allOf: [{ $ref: "#/components/schemas/IncidentCategory" }]
        severity: { $ref: "#/components/schemas/Severity" }
        status: { $ref: "#/components/schemas/IncidentStatus" }
        createdAt: { type: string, format: date-time }
        dueAt: { type: string, format: date-time, nullable: true }
        affectedCount: { type: integer, minimum: 0 }
        confirmedCount: { type: integer, minimum: 0 }
        mergedCount: { type: integer, minimum: 0 }
        reporterName: { type: string }
        photos:
          type: array
          items: { $ref: "#/components/schemas/Photo" }

    MergeIncidentsRequest:
      type: object
      required: [targetIncidentId, sourceIncidentIds]
      properties:
        targetIncidentId: { type: string, example: inc_01H, description: "Заявка, которая остаётся открытой" }
        sourceIncidentIds:
          type: array
          minItems: 1
          description: Заявки-дубликаты; не должны содержать targetIncidentId
          items: { type: string }

    MergeIncidentsResponse:
      type: object
      required: [targetIncidentId, mergedIncidentIds, affectedCount]
      properties:
        targetIncidentId: { type: string }
        mergedIncidentIds:
          type: array
          items: { type: string }
        affectedCount: { type: integer, minimum: 0, description: Подписанты главной заявки после склейки }

    PaginatedUkQueue:
      type: object
      required: [items, total, offset, limit]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/UkQueueItem" }
        total: { type: integer, minimum: 0 }
        offset: { type: integer, minimum: 0 }
        limit: { type: integer, minimum: 0 }

    EventStatus:
      type: string
      description: planned — до scheduledFrom, in_progress — идут работы, closed — после scheduledTo
      enum: [planned, in_progress, awaiting_confirmation, disputed, closed]

    Event:
      type: object
      required: [id, houseId, entrance, riser, reason, responsible, scheduledFrom, scheduledTo, status,
                 createdAt, resolvedAt]
      properties:
        id: { type: string, example: ev_1 }
        houseId: { type: string }
        entrance: { type: string, nullable: true }
        riser: { type: string, nullable: true }
        reason: { type: string }
        responsible: { type: string }
        scheduledFrom: { type: string, format: date-time }
        scheduledTo: { type: string, format: date-time }
        status: { $ref: "#/components/schemas/EventStatus" }
        createdAt: { type: string, format: date-time }
        resolvedAt: { type: string, format: date-time, nullable: true }

    EventListResponse:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/Event" }

    CreateEventRequest:
      type: object
      required: [houseId, reason, responsible, scheduledFrom, scheduledTo]
      properties:
        houseId: { type: string }
        reason: { type: string, minLength: 1, maxLength: 120 }
        responsible: { type: string, minLength: 1, maxLength: 80 }
        entrance: { type: string }
        riser: { type: string }
        scheduledFrom: { type: string, format: date-time }
        scheduledTo: { type: string, format: date-time }
