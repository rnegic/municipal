openapi: 3.0.3
info:
  title: УК-инциденты API
  version: 0.1.0
  description: |
    Бэкенд мини-аппа MAX для жильцов и УК. Источник правды по контракту —
    этот файл: из него генерируется Go-сервер (`make gen`) и TS-клиент для фронта
    (`npx openapi-typescript backend/openapi.yaml -o src/shared/api/schema.d.ts`).

    Авторизация: заголовок `Authorization: MaxInitData <initData>` (см. CLAUDE.md).
    Все ошибки — JSON `{"error": "..."}` с соответствующим HTTP-кодом.
    Ручки `/api/v1/admin/*` — только для роли `uk_dispatcher` (иначе 403).
servers:
  - url: http://localhost:8080
security:
  - MaxInitData: []

paths:
  /health:
    get:
      operationId: health
      security: []
      tags: [system]
      responses:
        "200":
          description: OK
          content:
            text/plain:
              schema: { type: string, example: ok }

  /api/v1/profile:
    get:
      operationId: getProfile
      tags: [profile]
      summary: Текущий пользователь (создаётся при первом вызове)
      responses:
        "200": { $ref: "#/components/responses/User" }
        "401": { $ref: "#/components/responses/Error" }
    post:
      operationId: bindHouse
      tags: [profile]
      summary: Привязать дом к пользователю
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/BindHouseRequest" }
      responses:
        "200": { $ref: "#/components/responses/User" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }

  /api/v1/addresses:
    get:
      operationId: suggestAddresses
      tags: [profile]
      summary: Подсказки адреса (прокси к Dadata, только до дома)
      parameters:
        - name: query
          in: query
          required: true
          schema: { type: string, minLength: 3 }
      responses:
        "200":
          description: Подсказки
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/AddressSuggestion" }
        "401": { $ref: "#/components/responses/Error" }
        "502": { $ref: "#/components/responses/Error" }

  /api/v1/incidents:
    get:
      operationId: listIncidents
      tags: [incidents]
      summary: Незакрытые заявки дома текущего пользователя
      responses:
        "200": { $ref: "#/components/responses/IncidentList" }
        "401": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
    post:
      operationId: createIncident
      tags: [incidents]
      summary: Создать заявку (с дедупом — может приклеить к существующей)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateIncidentRequest" }
      responses:
        "201":
          description: Создана или объединена с дубликатом
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CreateIncidentResponse" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }

  /api/v1/incidents/{id}/subscribe:
    post:
      operationId: subscribeIncident
      tags: [incidents]
      summary: «У меня тоже» (повтор — 204 без изменений)
      parameters: [{ $ref: "#/components/parameters/ID" }]
      responses:
        "204": { description: Подписан }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }

  /api/v1/incidents/{id}/handshake-response:
    post:
      operationId: respondHandshake
      tags: [incidents]
      summary: Ответ на «Проблема решена?» из мини-аппа
      parameters: [{ $ref: "#/components/parameters/ID" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/HandshakeRequest" }
      responses:
        "200": { $ref: "#/components/responses/Status" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }

  /api/v1/events:
    get:
      operationId: listEvents
      tags: [events]
      summary: Незакрытые события дома текущего пользователя
      responses:
        "200": { $ref: "#/components/responses/EventList" }
        "401": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }

  /api/v1/events/{id}/confirmation:
    post:
      operationId: confirmEvent
      tags: [events]
      summary: Подтверждение результата события жильцом
      parameters: [{ $ref: "#/components/parameters/ID" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/EventConfirmationRequest" }
      responses:
        "200": { $ref: "#/components/responses/Status" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }

  /api/v1/admin/incidents:
    get:
      operationId: adminListIncidents
      tags: [admin]
      summary: Заявки домов УК диспетчера, по убыванию подписчиков
      responses:
        "200": { $ref: "#/components/responses/IncidentList" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }

  /api/v1/admin/incidents/{id}/status:
    patch:
      operationId: adminSetIncidentStatus
      tags: [admin]
      summary: Новая → В работе → Выполнено (запускает рукопожатие)
      parameters: [{ $ref: "#/components/parameters/ID" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/IncidentStatusRequest" }
      responses:
        "204": { description: Статус изменён, пуши поставлены в очередь }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }

  /api/v1/admin/incidents/{id}/escalation-resolve:
    post:
      operationId: adminResolveIncidentEscalation
      tags: [admin]
      summary: Решение инженера по спорной заявке
      parameters: [{ $ref: "#/components/parameters/ID" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/EscalationResolveRequest" }
      responses:
        "200": { $ref: "#/components/responses/Status" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }

  /api/v1/admin/events:
    get:
      operationId: adminListEvents
      tags: [admin]
      summary: События домов УК диспетчера
      responses:
        "200": { $ref: "#/components/responses/EventList" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
    post:
      operationId: adminCreateEvent
      tags: [admin]
      summary: Создать плановое событие (пуш жильцам дома)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateEventRequest" }
      responses:
        "201":
          description: Создано
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CreateEventResponse" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }

  /api/v1/admin/events/{id}:
    patch:
      operationId: adminRescheduleEvent
      tags: [admin]
      summary: Сдвинуть сроки (пуш жильцам)
      parameters: [{ $ref: "#/components/parameters/ID" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RescheduleEventRequest" }
      responses:
        "204": { description: Обновлено }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }

  /api/v1/admin/events/{id}/status:
    patch:
      operationId: adminSetEventStatus
      tags: [admin]
      summary: «Готово» → ждёт подтверждения жильцов
      parameters: [{ $ref: "#/components/parameters/ID" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/EventStatusRequest" }
      responses:
        "204": { description: Обновлено }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }

  /api/v1/admin/events/{id}/escalation-resolve:
    post:
      operationId: adminResolveEventEscalation
      tags: [admin]
      summary: Решение инженера по спорному событию
      parameters: [{ $ref: "#/components/parameters/ID" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/EscalationResolveRequest" }
      responses:
        "200": { $ref: "#/components/responses/Status" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }

  /api/v1/bot/webhook:
    post:
      operationId: maxWebhook
      security: []
      tags: [system]
      summary: Входящие обновления от MAX Bot API (callback-кнопки)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: Update из MAX (update_type, callback.payload, callback.user.id)
              additionalProperties: true
      responses:
        "200": { description: Принято }

components:
  securitySchemes:
    MaxInitData:
      type: apiKey
      in: header
      name: Authorization
      description: "`MaxInitData <initData>` из MAX WebApp Bridge"

  parameters:
    ID:
      name: id
      in: path
      required: true
      schema: { type: integer, format: int64 }

  responses:
    Error:
      description: Ошибка
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Status:
      description: Текущий статус после действия
      content:
        application/json:
          schema: { $ref: "#/components/schemas/StatusResponse" }
    User:
      description: Профиль
      content:
        application/json:
          schema: { $ref: "#/components/schemas/User" }
    IncidentList:
      description: Список заявок
      content:
        application/json:
          schema:
            type: array
            items: { $ref: "#/components/schemas/Incident" }
    EventList:
      description: Список событий
      content:
        application/json:
          schema:
            type: array
            items: { $ref: "#/components/schemas/Event" }

  schemas:
    Error:
      type: object
      required: [error]
      properties:
        error: { type: string }

    StatusResponse:
      type: object
      required: [status]
      properties:
        status: { type: string }

    Role:
      type: string
      enum: [resident, uk_dispatcher]

    Category:
      type: string
      enum: [electricity, water, elevator, yard, other]

    IncidentStatus:
      type: string
      enum: [new, in_progress, awaiting_confirmation, disputed, closed]

    EventStatus:
      type: string
      enum: [planned, in_progress, awaiting_confirmation, disputed, closed]

    User:
      type: object
      required: [id, max_user_id, full_name, role, house_id, uk_id]
      properties:
        id: { type: integer, format: int64 }
        max_user_id: { type: integer, format: int64 }
        full_name: { type: string }
        role: { $ref: "#/components/schemas/Role" }
        house_id: { type: integer, format: int64, nullable: true }
        uk_id: { type: integer, format: int64, nullable: true }

    AddressSuggestion:
      type: object
      required: [value, house_fias_id]
      properties:
        value: { type: string, example: "г Казань, ул Баумана, д 10" }
        house_fias_id: { type: string }

    BindHouseRequest:
      type: object
      required: [address_raw, house_fias_id]
      properties:
        address_raw: { type: string }
        house_fias_id: { type: string }

    Incident:
      type: object
      required: [id, house_id, house_address, category, reporter_id, description,
                 entrance, riser, status, created_at, resolved_at, subscribers, subscribed]
      properties:
        id: { type: integer, format: int64 }
        house_id: { type: integer, format: int64 }
        house_address: { type: string }
        category: { $ref: "#/components/schemas/Category" }
        reporter_id: { type: integer, format: int64 }
        description: { type: string }
        entrance: { type: string, nullable: true }
        riser: { type: string, nullable: true }
        status: { $ref: "#/components/schemas/IncidentStatus" }
        created_at: { type: string, format: date-time }
        resolved_at: { type: string, format: date-time, nullable: true }
        subscribers: { type: integer, description: "Сколько жильцов нажали «У меня тоже» (включая автора)" }
        subscribed: { type: boolean, description: "Текущий пользователь уже подписан" }

    CreateIncidentRequest:
      type: object
      required: [category, description]
      properties:
        category: { $ref: "#/components/schemas/Category" }
        description: { type: string, minLength: 1 }
        entrance: { type: string }
        riser: { type: string }

    CreateIncidentResponse:
      type: object
      required: [incident_id, merged]
      properties:
        incident_id: { type: integer, format: int64 }
        merged: { type: boolean, description: "true — приклеили к существующей заявке (дедуп)" }

    IncidentStatusRequest:
      type: object
      required: [status]
      properties:
        status: { type: string, enum: [in_progress, resolved] }

    HandshakeRequest:
      type: object
      required: [answer]
      properties:
        answer: { type: string, enum: [yes, "no"] }

    EscalationResolveRequest:
      type: object
      required: [confirmed]
      properties:
        confirmed: { type: boolean, description: "true — работа реально выполнена" }
        photo_url: { type: string }

    Event:
      type: object
      required: [id, house_id, dispatcher_id, house_address, entrance, riser, reason, responsible,
                 scheduled_from, scheduled_to, status, created_at, resolved_at, my_answer, recipients]
      properties:
        id: { type: integer, format: int64 }
        house_id: { type: integer, format: int64 }
        dispatcher_id: { type: integer, format: int64 }
        house_address: { type: string }
        entrance: { type: string, nullable: true }
        riser: { type: string, nullable: true }
        reason: { type: string }
        responsible: { type: string }
        scheduled_from: { type: string, format: date-time }
        scheduled_to: { type: string, format: date-time }
        status: { $ref: "#/components/schemas/EventStatus" }
        created_at: { type: string, format: date-time }
        resolved_at: { type: string, format: date-time, nullable: true }
        my_answer: { type: string, enum: [yes, partial, "no"], nullable: true }
        recipients: { type: integer, description: "Сколько жильцов получили уведомление" }

    CreateEventRequest:
      type: object
      required: [house_id, reason, responsible, scheduled_from, scheduled_to]
      properties:
        house_id: { type: integer, format: int64 }
        entrance: { type: string }
        riser: { type: string }
        reason: { type: string, minLength: 1 }
        responsible: { type: string, minLength: 1 }
        scheduled_from: { type: string, format: date-time }
        scheduled_to: { type: string, format: date-time }

    CreateEventResponse:
      type: object
      required: [event_id]
      properties:
        event_id: { type: integer, format: int64 }

    RescheduleEventRequest:
      type: object
      required: [scheduled_from, scheduled_to, reason]
      properties:
        scheduled_from: { type: string, format: date-time }
        scheduled_to: { type: string, format: date-time }
        reason: { type: string, minLength: 1 }

    EventStatusRequest:
      type: object
      required: [status]
      properties:
        status: { type: string, enum: [done] }

    EventConfirmationRequest:
      type: object
      required: [answer]
      properties:
        answer: { type: string, enum: [yes, partial, "no"] }
        photo_url: { type: string }
