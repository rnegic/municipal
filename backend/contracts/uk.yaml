openapi: 3.0.3
info:
  title: Контракт системы УК
  version: 0.1.0
  description: |
    Что система управляющей компании предоставляет бэкенду «УК-инциденты».
    Из этого файла генерируется клиент нашего бэкенда (gen/uk) и сервер
    референсной реализации mock/uk. Авторизация: `Authorization: Bearer <token>`.
    Ручки с тегом `dispatcher` — внутреннее действие УК (у настоящей УК свой UI);
    мы зовём PATCH только чтобы выставить `done` по подтверждениям жителей.
servers:
  - url: http://localhost:8081
security:
  - Bearer: []

paths:
  /houses/{fiasId}:
    get:
      operationId: findHouse
      summary: Какая организация обслуживает дом (по ФИАС-id дома)
      parameters:
        - { name: fiasId, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: Дом обслуживается
          content: { application/json: { schema: { $ref: "#/components/schemas/House" } } }
        "401":
          description: Нет/неверный токен
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
        "404":
          description: Дом не обслуживается этой системой
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }

  /incidents:
    post:
      operationId: registerIncident
      summary: Зарегистрировать обращение (идемпотентно по externalRef)
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/RegisterIncidentRequest" } } }
      responses:
        "201":
          description: Создано
          content: { application/json: { schema: { $ref: "#/components/schemas/Incident" } } }
        "200":
          description: Уже было зарегистрировано с таким externalRef
          content: { application/json: { schema: { $ref: "#/components/schemas/Incident" } } }
        "400":
          description: Невалидное тело
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
        "401":
          description: Нет/неверный токен
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
        "404":
          description: Неизвестный houseId
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
    get:
      operationId: listIncidentUpdates
      summary: Инциденты, изменившиеся после updatedSince (для поллинга)
      parameters:
        - { name: updatedSince, in: query, required: true, schema: { type: string, format: date-time } }
      responses:
        "200":
          description: Список, отсортирован по updatedAt по возрастанию
          content: { application/json: { schema: { $ref: "#/components/schemas/IncidentUpdates" } } }
        "401":
          description: Нет/неверный токен
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }

  /incidents/{id}:
    patch:
      operationId: setIncidentStatus
      tags: [dispatcher]
      summary: Сменить статус (диспетчер УК; наш бэкенд — только done)
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/SetStatusRequest" } } }
      responses:
        "200":
          description: Обновлено
          content: { application/json: { schema: { $ref: "#/components/schemas/Incident" } } }
        "400":
          description: Невалидный статус
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
        "401":
          description: Нет/неверный токен
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
        "404":
          description: Нет такого инцидента
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
        "409":
          description: Переход из done/false_alarm запрещён
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }

components:
  securitySchemes:
    Bearer: { type: http, scheme: bearer }
  schemas:
    Error:
      type: object
      required: [code, message]
      properties:
        code: { type: string, example: not_found }
        message: { type: string }
    IncidentStatus:
      type: string
      enum: [accepted, in_progress, verifying, done, false_alarm]
    Severity:
      type: string
      enum: [critical, warning]
    Organization:
      type: object
      required: [id, name]
      properties:
        id: { type: string, example: uk-1 }
        name: { type: string, example: "УК Наш Дом" }
        phone: { type: string, nullable: true, description: "телефон приёмной/диспетчерской УК" }
        emergencyPhone: { type: string, nullable: true, description: "аварийная служба (круглосуточно)" }
        email: { type: string, nullable: true }
        website: { type: string, nullable: true }
        officeAddress: { type: string, nullable: true, description: "адрес офиса УК" }
        workingHours: { type: string, nullable: true, example: "Пн–Пт 8:00–17:00" }
    House:
      type: object
      required: [id, address, organization]
      properties:
        id: { type: string, example: h-1 }
        address: { type: string }
        organization: { $ref: "#/components/schemas/Organization" }
    RegisterIncidentRequest:
      type: object
      required: [externalRef, houseId, title, description, severity]
      properties:
        externalRef: { type: string, description: "id инцидента на стороне вызывающего" }
        houseId: { type: string }
        title: { type: string, minLength: 1 }
        description: { type: string }
        severity: { $ref: "#/components/schemas/Severity" }
        entrance: { type: string }
        riser: { type: string }
        suspicious: { type: boolean, description: "автор ранее ≥3 раз получал false_alarm; УК показывает такие обращения отдельно" }
    Incident:
      type: object
      required: [id, externalRef, status, updatedAt]
      properties:
        id: { type: string, example: INC-001 }
        externalRef: { type: string }
        status: { $ref: "#/components/schemas/IncidentStatus" }
        updatedAt: { type: string, format: date-time }
    IncidentUpdates:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/Incident" }
    SetStatusRequest:
      type: object
      required: [status]
      properties:
        status: { $ref: "#/components/schemas/IncidentStatus" }
