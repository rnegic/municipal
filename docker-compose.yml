# Прод: docker compose up -d --build. Секреты — в .env рядом (см. .env.example).
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ukapp
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in .env}
      POSTGRES_DB: ukapp
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ukapp"]
      interval: 3s
      retries: 20
    restart: unless-stopped

  api:
    build: ./backend
    environment:
      DATABASE_URL: postgres://ukapp:${POSTGRES_PASSWORD}@db:5432/ukapp?sslmode=disable
      MAX_BOT_TOKEN: ${MAX_BOT_TOKEN:-}
      DADATA_TOKEN: ${DADATA_TOKEN:-}
    ports: ["127.0.0.1:8080:8080"] # наружу — через nginx на хосте
    depends_on:
      db: { condition: service_healthy }
    restart: unless-stopped

volumes:
  pgdata:
