# Прод: docker compose pull && docker compose up -d. Образы api/mock-uk собираются
# и пушатся в GHCR из GitHub Actions (deploy.yml). Секреты — в .env рядом (см. .env.example).
# Диспетчер работает в системе УК; для MVP это mock-uk (docs/uk-integration.md).
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ukapp
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in .env}
      POSTGRES_DB: ukapp
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ukapp"]
      interval: 3s
      retries: 20
    restart: unless-stopped

  api:
    image: ghcr.io/rnegic/municipal-api:latest
    environment:
      DATABASE_URL: postgres://ukapp:${POSTGRES_PASSWORD}@db:5432/ukapp?sslmode=disable
      MAX_BOT_TOKEN: ${MAX_BOT_TOKEN:-}
      DADATA_TOKEN: ${DADATA_TOKEN:-}
      UK_BASE_URL: http://mock-uk:8080
      UK_API_TOKEN: ${UK_API_TOKEN:-demo-uk-token}
      UK_SYNC_INTERVAL: 5s
      UK_JWT_PRIVATE_KEY: ${UK_JWT_PRIVATE_KEY:-}
      LAYA_URL: http://laya:8090
      LAYA_CATEGORY_THRESHOLD: ${LAYA_CATEGORY_THRESHOLD:-0.7}
      DEDUP_URL: http://dedup:8090
      DEDUP_TIMEOUT: ${DEDUP_TIMEOUT:-5s}
    ports: ["127.0.0.1:8080:8080"] # наружу — через nginx на хосте
    depends_on:
      db: { condition: service_healthy }
      mock-uk: { condition: service_started }
    restart: unless-stopped

  laya:
    image: ghcr.io/rnegic/municipal-laya:latest
    mem_limit: 3g
    environment:
      LAYA_THREADS: ${LAYA_THREADS:-2}
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:8090/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      start_period: 120s
    restart: unless-stopped

  dedup:
    image: ghcr.io/rnegic/municipal-dedup:latest
    mem_limit: 1536m
    environment:
      DEDUP_THREADS: ${DEDUP_THREADS:-2}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8090/healthz')"]
      interval: 10s
      start_period: 60s
    restart: unless-stopped

  mock-uk-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: mockuk
      POSTGRES_PASSWORD: mockuk
      POSTGRES_DB: mockuk
    volumes: ["mockuk-pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mockuk"]
      interval: 3s
      retries: 20
    restart: unless-stopped

  mock-uk:
    image: ghcr.io/rnegic/municipal-mockuk:latest
    environment:
      DATABASE_URL: postgres://mockuk:mockuk@mock-uk-db:5432/mockuk?sslmode=disable
      MOCK_API_TOKEN: ${UK_API_TOKEN:-demo-uk-token}
      MOCK_FAILURE_RATE: ${MOCK_FAILURE_RATE:-0}
    ports: ["127.0.0.1:8081:8080"] # ЛК диспетчера, временно — за nginx на хосте при необходимости
    depends_on:
      mock-uk-db: { condition: service_healthy }
    restart: unless-stopped

volumes:
  pgdata:
  mockuk-pgdata:
