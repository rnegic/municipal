# Выкат по кнопке: Actions → Deploy → Run workflow.
# Секрет DEPLOY_SSH_KEY — приватный ключ, чей pub лежит в /root/.ssh/authorized_keys на сервере.
name: Deploy
on:
  workflow_dispatch:

concurrency: deploy

env:
  HOST: 136.234.4.220
  DIR: /opt/municipal

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: ssh key
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "$HOST" >> ~/.ssh/known_hosts
      - name: sync
        run: rsync -az --delete --exclude .git --exclude node_modules --exclude .env ./ "root@$HOST:$DIR/"
      - name: up
        run: ssh "root@$HOST" "cd $DIR && docker compose up -d --build --remove-orphans && docker image prune -f && curl -fsS localhost/health"
