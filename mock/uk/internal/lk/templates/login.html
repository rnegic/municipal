<!doctype html><html lang="ru"><head><meta charset="utf-8"><title>УК — вход</title>
<style>body{font:16px system-ui;max-width:420px;margin:60px auto;padding:0 16px}input,button{font:inherit;padding:8px;width:100%;margin:6px 0}.err{color:#b00}</style>
</head><body>
<h1>Система УК — вход диспетчера</h1>
{{if .Error}}<p class="err">{{.Error}}</p>{{end}}
<form method="post" action="/lk/login">
  <input name="login" placeholder="Логин" required autofocus>
  <input name="password" type="password" placeholder="Пароль" required>
  <button>Войти</button>
</form>
</body></html>
